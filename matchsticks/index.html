<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gogosik's Matchsticks</title>
<meta name="description" content="Free matchstick puzzle game for kids: move one match to make the math true. 15 puzzles, English and Russian, works offline.">
<meta name="theme-color" content="#1D3A35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gogosik">
<meta property="og:title" content="Gogosik's Matchsticks">
<meta property="og:description" content="Move one match to make the math true. A free puzzle game for kids.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
html{-webkit-text-size-adjust:100%}body{margin:0}
[hidden]{display:none!important}
/* Layout: one column — header, the felt game board as the hero object, Gogosik talking below it, then the level map. */
:root{
  --bg:#EDF4F1; --surface:#FFFFFF; --fg:#13302D; --muted:#4F6A66; --line:#CFDDD8;
  --accent:#17897B; --accent-ink:#FFFFFF; --ember:#E5791C; --good:#2B8F55; --bad:#C2412D;
  /* the board is a physical object: same dark felt in both themes */
  --felt:#1D3A35; --felt-edge:#12261F; --felt-ghost:rgba(233,214,170,.32); --felt-ghost-on:rgba(255,226,150,.75);
  --wood:#EBC67E; --wood-shade:#C99A4C; --head:#D3442C; --glow:#FFD86B;
  --dragon:#2AA58F; --dragon-dark:#1B7C6C; --belly:#F6E6BF; --spike:#F07C6C; --wing:#F2A7A1; --petal:#F5837A;
  --f-display:"Rubik",system-ui,"Segoe UI",sans-serif;
  --f-body:"Nunito",system-ui,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1817; --surface:#152523; --fg:#E2EFEB; --muted:#9DB6B1; --line:#27403C;
    --accent:#3CC3B0; --accent-ink:#06211D; --ember:#F39A45; --good:#5CC98A; --bad:#F07A63;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1817; --surface:#152523; --fg:#E2EFEB; --muted:#9DB6B1; --line:#27403C;
  --accent:#3CC3B0; --accent-ink:#06211D; --ember:#F39A45; --good:#5CC98A; --bad:#F07A63;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 span{color:var(--ember)}
.sub{margin:4px 0 0;color:var(--muted);font-weight:700}
.lang{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button{font:800 .9rem var(--f-display);border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer;min-height:40px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.board{background:var(--felt);border-radius:var(--r);padding:clamp(14px,4vw,28px) clamp(10px,3vw,24px) clamp(12px,3vw,20px);
  box-shadow:inset 0 0 0 6px var(--felt-edge),inset 0 12px 30px rgba(0,0,0,.35);position:relative}
.board-top{display:flex;justify-content:space-between;align-items:center;color:#CFE3DD;font:700 .85rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.tier-pill{background:rgba(255,255,255,.1);border-radius:999px;padding:3px 10px}
.stars{color:var(--glow);letter-spacing:2px;font-size:1rem}
svg.eq{display:block;width:100%;height:auto;max-height:260px;touch-action:manipulation}
.slot{cursor:pointer;outline:none}
.slot .hit{fill:transparent}
.slot .ghost{stroke:var(--felt-ghost);stroke-width:6;stroke-linecap:round;stroke-dasharray:3 8;fill:none;transition:stroke .2s}
.holding .slot.empty .ghost{stroke:var(--felt-ghost-on)}
.slot.empty:hover .ghost,.slot.empty:focus-visible .ghost{stroke:var(--glow)}
.match line.stick{stroke:var(--wood);stroke-width:7.5;stroke-linecap:round}
.match line.shade{stroke:var(--wood-shade);stroke-width:2.2;stroke-linecap:round;opacity:.7}
.match circle{fill:var(--head)}
.slot.on:hover .match,.slot.on:focus-visible .match{filter:drop-shadow(0 0 4px rgba(255,216,107,.6))}
.slot.picked .match{transform:translate(0,-6px);filter:drop-shadow(0 0 7px var(--glow)) drop-shadow(0 6px 4px rgba(0,0,0,.45))}
.slot.cue .match{animation:cue 1s ease-in-out infinite}
.slot.cue-target .ghost{stroke:var(--glow);animation:blink 1s steps(2) infinite}
.fixed line.stick{stroke:var(--wood);stroke-width:7.5;stroke-linecap:round;opacity:.9}
.fixed circle{fill:var(--head);opacity:.9}
.solved .match line.stick{stroke:#FFE39A}
.shake{animation:shake .45s}
@keyframes cue{50%{filter:drop-shadow(0 0 9px var(--glow))}}
@keyframes blink{50%{stroke:transparent}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

.talk{display:flex;align-items:flex-end;gap:12px}
.dragon{width:128px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 16px;font-weight:700;font-size:1.05rem;min-height:64px;flex:1;min-width:0;margin-bottom:18px}
.bubble::before{content:"";position:absolute;left:-11px;bottom:18px;width:18px;height:18px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble.win{border-color:var(--good)}.bubble.win::before{border-color:var(--good)}
.bubble.oops{border-color:var(--ember)}.bubble.oops::before{border-color:var(--ember)}

.controls{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:800 1rem var(--f-display);border-radius:14px;padding:12px 18px;min-height:48px;cursor:pointer;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
.btn:focus-visible,.lang button:focus-visible,.dot:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.map{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px}
.map-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.map-row b{font-family:var(--f-display);min-width:104px;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--fg);font:800 .95rem var(--f-display);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.done{background:color-mix(in srgb,var(--good) 18%,transparent);border-color:var(--good)}
.dot.current{background:var(--ember);border-color:var(--ember);color:#fff}
.note{color:var(--muted);font-size:.9rem;margin:0}

/* Gogosik: real character art, one pose per mood */
.dragon{display:grid;align-self:flex-end}
.dragon .g{grid-area:1/1;width:100%;height:auto;opacity:0;transform:scale(.96);transition:opacity .18s,transform .18s;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.dragon.idle .g-idle,.dragon.think .g-think,.dragon.oops .g-oops,.dragon.happy .g-happy{opacity:1;transform:none}
.dragon.idle .g-idle{animation:bob 3.2s ease-in-out infinite}
.dragon.happy .g-happy{animation:hop .6s ease-out 2}
.dragon.oops .g-oops{animation:wobble .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes hop{40%{transform:translateY(-14px)}}
@keyframes wobble{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.install{font:800 .9rem var(--f-display);border:2px solid var(--ember);background:var(--ember);color:#fff;border-radius:999px;padding:8px 16px;min-height:40px;cursor:pointer}
.install:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ios-tip{background:var(--surface);border:2px dashed var(--ember);border-radius:var(--r);padding:12px 16px;margin:0;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:.9rem}.foot a{color:var(--accent);font-weight:800}
@media (display-mode:standalone){.foot a[href="../"]{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:460px){.dragon{width:100px}.bubble{font-size:1rem}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 id="title">Gogosik's <span>Matchsticks</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="head-actions">
    <button type="button" class="install" id="install-btn" hidden>⬇ Install</button>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-ru" data-lang="ru">RU</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
    </div>
  </header>

  <section class="board" id="board" aria-live="polite">
    <div class="board-top"><span id="level-label"></span><span class="tier-pill" id="tier-label"></span><span class="stars" id="stars" aria-hidden="true"></span></div>
    <svg class="eq" id="eq" role="group" aria-label="Matchstick equation"></svg>
  </section>

  <div class="talk">
    <div class="dragon idle" id="dragon" aria-hidden="true">
      <img class="g g-idle" src="img/gogosik-idle.webp" alt="" width="249" height="300">
      <img class="g g-think" src="img/gogosik-think.webp" alt="" width="249" height="300">
      <img class="g g-oops" src="img/gogosik-oops.webp" alt="" width="249" height="300">
      <img class="g g-happy" src="img/gogosik-happy.webp" alt="" width="249" height="300">
    </div>
    <p class="bubble" id="bubble" role="status"></p>
  </div>

  <div class="controls">
    <button type="button" class="btn" id="hint-btn"></button>
    <button type="button" class="btn" id="reset-btn"></button>
    <button type="button" class="btn primary" id="next-btn"></button>
  </div>

  <section class="map" aria-label="Levels">
    <div class="map-row"><b id="t-easy"></b><div class="dots" id="dots-easy"></div></div>
    <div class="map-row"><b id="t-medium"></b><div class="dots" id="dots-medium"></div></div>
    <div class="map-row"><b id="t-hard"></b><div class="dots" id="dots-hard"></div></div>
    <p class="note" id="note"></p>
  </section>
  <p class="ios-tip" id="ios-tip" hidden></p>
  <footer class="foot"><a href="../">More free games</a> · Made with AI by <a href="https://www.instagram.com/mrkmediastudio/" target="_blank" rel="noopener">MRK Media Studio</a></footer>
</div>

<script>
(function(){
const PUZZLES=[
  {eq:"2+1=5",tier:"easy"},{eq:"3+3=9",tier:"easy"},{eq:"4+5=6",tier:"easy"},{eq:"2+3=3",tier:"easy"},{eq:"7+2=6",tier:"medium"},
  {eq:"9+5=6",tier:"medium"},{eq:"4+6=5",tier:"medium"},{eq:"8+3=5",tier:"medium"},{eq:"1+6=8",tier:"medium"},{eq:"9+3=6",tier:"medium"},
  {eq:"7-1=2",tier:"hard"},{eq:"8-3=9",tier:"hard"},{eq:"5+5=1",tier:"hard"},{eq:"9+1=6",tier:"hard"},{eq:"4-1=9",tier:"hard"}
];
const T={
 ru:{title:'Спички <span>Гогосика</span>',sub:'Переложи одну спичку, чтобы пример стал верным.',
  level:(n,t)=>`Задача ${n} из ${t}`,tiers:{easy:'Лёгкие',medium:'Средние',hard:'Хитрые'},
  hint:'Подсказка',reset:'Сначала',next:'Дальше',
  start:'Привет! Я Гогосик. Переложи всего одну спичку, и пример станет верным.',
  pickFirst:'Сначала возьми спичку: нажми на неё.',
  holding:'Отлично! Теперь нажми на пустое место, куда её положить.',
  dropped:'Спичка снова на месте. Выбери другую.',
  notDigit:'Хм, такой цифры не бывает. Возвращаю спичку, попробуй ещё!',
  wrong:r=>`Получилось ${pretty(r)}, но это неверно. Возвращаю спичку!`,
  win:r=>`Ура! ${pretty(r)} — верно! Ты молодец!`,
  roles:{n1:'в первом числе',op:'в знаке',n2:'во втором числе',ans:'в ответе'},
  hint1:r=>`Нужная спичка спрятана ${r}.`,
  hint2:'Вот она светится! Куда её переложить?',
  hint3:'Положи её на место, которое мигает.',
  allDone:'Все задачи решены! Гогосик тобой гордится.',
  note:'Для родителей: каждая задача проверена программой-решателем. Засчитывается любой верный ход, а не только наш.',
  aria:(i,s,on)=>`${on?'Спичка':'Пустое место'}`},
 en:{title:'Gogosik’s <span>Matchsticks</span>',sub:'Move one match to make the sum true.',
  level:(n,t)=>`Puzzle ${n} of ${t}`,tiers:{easy:'Easy',medium:'Medium',hard:'Tricky'},
  hint:'Hint',reset:'Start over',next:'Next',
  start:'Hi! I’m Gogosik. Move just one match and the sum will be true.',
  pickFirst:'First pick up a match: tap it.',
  holding:'Great! Now tap an empty spot to put it there.',
  dropped:'The match is back. Pick another one.',
  notDigit:'Hmm, that’s not a real number. I’ll put the match back, try again!',
  wrong:r=>`That makes ${pretty(r)}, which isn’t true. Putting the match back!`,
  win:r=>`Hooray! ${pretty(r)} is right! Well done!`,
  roles:{n1:'in the first number',op:'in the sign',n2:'in the second number',ans:'in the answer'},
  hint1:r=>`The match you need is ${r}.`,
  hint2:'Look, it’s glowing! Where should it go?',
  hint3:'Put it on the blinking spot.',
  allDone:'You solved every puzzle! Gogosik is proud of you.',
  note:'For parents: every puzzle is checked by a solver program. Any correct move counts, not just ours.',
  aria:(i,s,on)=>`${on?'Match':'Empty spot'}`}
};
function pretty(s){return s.replace('-', '−').replace('=', ' = ').replace('+',' + ').replace('−',' − ')}

/* seven-segment model */
const DIG={0:'abcdef',1:'bc',2:'abdeg',3:'abcdg',4:'bcfg',5:'acdfg',6:'acdefg',7:'abc',8:'abcdefg',9:'abcdfg'};
const SEG2D={};for(const d in DIG)SEG2D[DIG[d].split('').sort().join('')]=+d;
function build(eq){
  const [l,c]=eq.split('=');const m=l.match(/^(\d+)([+-])(\d+)$/);const out=[];
  const num=(n,role)=>{for(const ch of n)out.push({t:'d',role,on:new Set(DIG[ch])})};
  num(m[1],'n1');out.push({t:'o',role:'op',on:new Set(m[2]==='+'?['h','v']:['h'])});num(m[3],'n2');out.push({t:'eq'});num(c,'ans');
  return out;
}
function clone(sl){return sl.map(x=>x.t==='eq'?x:{t:x.t,role:x.role,on:new Set(x.on)})}
function read(sl){let s='';for(const x of sl){if(x.t==='d'){const k=[...x.on].sort().join('');if(!(k in SEG2D))return null;s+=SEG2D[k]}
  else if(x.t==='o'){const k=[...x.on].sort().join('');if(k==='h')s+='-';else if(k==='hv')s+='+';else return null}else s+='='}return s}
function truth(s){if(!s)return false;const [l,c]=s.split('=');const m=l.match(/^(\d+)([+-])(\d+)$/);if(!m||!/^\d+$/.test(c))return false;
  for(const n of [m[1],m[3],c])if(n.length>1&&n[0]==='0')return false;
  return (m[2]==='+'?+m[1]+ +m[3]:+m[1]-m[3])===+c}
const SLOTSEGS=x=>x.t==='d'?'abcdefg':x.t==='o'?'hv':'';
function solve(eq){const sl=build(eq),out=[];sl.forEach((x,i)=>{if(x.t==='eq')return;for(const s of x.on)sl.forEach((y,j)=>{if(y.t==='eq')return;
  for(const t of SLOTSEGS(y)){if(i===j&&s===t)continue;if(y.on.has(t)&&!(i===j&&t===s))continue;
    const c=clone(sl);c[i].on.delete(s);c[j].on.add(t);if(truth(read(c)))out.push({i,s,j,t,res:read(c)})}})});return out}

/* geometry */
const DW=64,OW=56,GAP=8,H=124,PADX=6;
function segLine(x0,kind,s){
  if(kind==='d'){const L=x0+13,R=x0+51,lx=x0+8,rx=x0+56;
    return {a:[L,8,R,8],g:[L,62,R,62],d:[L,116,R,116],f:[lx,13,lx,57],b:[rx,13,rx,57],e:[lx,67,lx,111],c:[rx,67,rx,111]}[s]}
  if(kind==='o')return {h:[x0+8,62,x0+48,62],v:[x0+28,42,x0+28,82]}[s];
  return {h1:[x0+8,50,x0+48,50],h2:[x0+8,74,x0+48,74]}[s];
}
function matchSvg([x1,y1,x2,y2]){const hx=y1===y2?x2:x1,hy=y1===y2?y2:y1;
  const off=y1===y2?[0,-1.6]:[-1.6,0];
  return `<line class="stick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="shade" x1="${x1+off[0]}" y1="${y1+off[1]}" x2="${x2+off[0]}" y2="${y2+off[1]}"/><circle cx="${hx}" cy="${hy}" r="5.6"/>`}

/* state */
let lang=detectLang(),idx=0,slots=[],picked=null,locked=false,solved=false,hintLevel=0,sol=null,progress=load();
function detectLang(){try{const s=localStorage.getItem('gogosik-lang');if(s)return s}catch(e){}return (navigator.language||'en').toLowerCase().startsWith('ru')?'ru':'en'}
function load(){try{return JSON.parse(localStorage.getItem('gogosik-progress')||'{}')}catch(e){return {}}}
function save(){try{localStorage.setItem('gogosik-progress',JSON.stringify(progress))}catch(e){}}
const $=id=>document.getElementById(id);

function say(text,mood,cls){$('bubble').textContent=text;$('bubble').className='bubble'+(cls?' '+cls:'');$('dragon').className='dragon '+(mood||'idle')}

function start(i){idx=i;slots=build(PUZZLES[i].eq);picked=null;locked=false;solved=false;hintLevel=0;
  const s=solve(PUZZLES[i].eq);sol=s[0]||null;say(T[lang].start,'idle');render();renderMap();}

function render(){
  const t=T[lang],p=PUZZLES[idx];
  $('level-label').textContent=t.level(idx+1,PUZZLES.length);$('tier-label').textContent=t.tiers[p.tier];
  const best=progress[p.eq]||0;$('stars').textContent=best?'★'.repeat(best)+'☆'.repeat(3-best):'';
  let x=PADX,parts=[];
  slots.forEach((sl,i)=>{
    const w=sl.t==='d'?DW:OW;
    if(sl.t==='eq'){parts.push(`<g class="fixed">${matchSvg(segLine(x,'e','h1'))}${matchSvg(segLine(x,'e','h2'))}</g>`)}
    else for(const s of SLOTSEGS(sl)){
      const ln=segLine(x,sl.t,s),on=sl.on.has(s);
      const isPicked=picked&&picked.i===i&&picked.s===s;
      const cue=hintLevel>=2&&sol&&!solved&&!picked&&sol.i===i&&sol.s===s;
      const cueT=hintLevel>=3&&sol&&!solved&&sol.j===i&&sol.t===s&&!on;
      const horiz=ln[1]===ln[3];
      const hit=horiz?`x="${ln[0]-6}" y="${ln[1]-13}" width="${ln[2]-ln[0]+12}" height="26"`:`x="${ln[0]-13}" y="${ln[1]-6}" width="26" height="${ln[3]-ln[1]+12}"`;
      parts.push(`<g class="slot ${on?'on':'empty'}${isPicked?' picked':''}${cue?' cue':''}${cueT?' cue-target':''}" data-i="${i}" data-s="${s}" tabindex="0" role="button" aria-label="${t.aria(i,s,on)}">
        <rect class="hit" ${hit} rx="8"/>${on?`<g class="match">${matchSvg(ln)}</g>`:`<line class="ghost" x1="${ln[0]}" y1="${ln[1]}" x2="${ln[2]}" y2="${ln[3]}"/>`}</g>`);
    }
    x+=w+GAP;
  });
  const svg=$('eq');svg.setAttribute('viewBox',`0 0 ${x-GAP+PADX} ${H+8}`);svg.innerHTML=parts.join('');
  svg.classList.toggle('holding',!!picked);svg.classList.toggle('solved',solved);
  $('hint-btn').disabled=solved||hintLevel>=3||!sol;
  $('next-btn').disabled=!solved&&!progress[p.eq];
}

function renderMap(){
  const t=T[lang];
  ['easy','medium','hard'].forEach(tier=>{
    $('t-'+tier).textContent=t.tiers[tier];
    $('dots-'+tier).innerHTML=PUZZLES.map((p,i)=>p.tier!==tier?'':`<button type="button" class="dot${progress[p.eq]?' done':''}${i===idx?' current':''}" data-go="${i}" aria-label="${t.level(i+1,PUZZLES.length)}">${i+1}</button>`).join('');
  });
}

function onSlot(i,s){
  if(locked||solved)return;const t=T[lang],sl=slots[i],on=sl.on.has(s);
  if(!picked){if(on){picked={i,s};say(t.holding,'think')}else say(t.pickFirst,'think');render();return}
  if(picked.i===i&&picked.s===s){picked=null;say(t.dropped,'idle');render();return}
  if(on){picked={i,s};render();return}
  const before=clone(slots);slots[picked.i].on.delete(picked.s);slots[i].on.add(s);picked=null;render();
  const r=read(slots);
  if(truth(r)){solved=true;const stars=hintLevel===0?3:hintLevel===1?2:1;
    progress[PUZZLES[idx].eq]=Math.max(progress[PUZZLES[idx].eq]||0,stars);save();
    const all=PUZZLES.every(p=>progress[p.eq]);say(all&&idx===PUZZLES.length-1?t.win(r)+' '+t.allDone:t.win(r),'happy','win');render();renderMap();return}
  locked=true;say(r?t.wrong(r):t.notDigit,'oops','oops');
  const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  setTimeout(()=>{slots=before;locked=false;render()},1500);
}

$('eq').addEventListener('click',e=>{const g=e.target.closest('.slot');if(g)onSlot(+g.dataset.i,g.dataset.s)});
$('eq').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('.slot');if(!g)return;e.preventDefault();
  const i=+g.dataset.i,s=g.dataset.s;onSlot(i,s);const again=document.querySelector(`.slot[data-i="${i}"][data-s="${s}"]`);if(again)again.focus()});
$('hint-btn').addEventListener('click',()=>{if(!sol||solved)return;const t=T[lang];hintLevel=Math.min(3,hintLevel+1);
  if(hintLevel===1)say(t.hint1(t.roles[slots[sol.i].role]),'think');else if(hintLevel===2){picked=null;say(t.hint2,'think')}else say(t.hint3,'think');render()});
$('reset-btn').addEventListener('click',()=>{if(!locked)start(idx)});
$('next-btn').addEventListener('click',()=>{const n=PUZZLES.findIndex((p,i)=>i>idx&&!progress[p.eq]);start(n>=0?n:(idx+1)%PUZZLES.length)});
document.querySelector('.map').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!locked)start(+b.dataset.go)});
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;try{localStorage.setItem('gogosik-lang',lang)}catch(e){}applyLang()}));

function applyLang(){const t=T[lang];document.documentElement.lang=lang;$('title').innerHTML=t.title;$('sub').textContent=t.sub;
  $('hint-btn').textContent=t.hint;$('reset-btn').textContent=t.reset;$('next-btn').textContent=t.next;$('note').textContent=t.note;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  if(!solved&&!picked&&!locked)say(t.start,'idle');render();renderMap()}

const firstOpen=PUZZLES.findIndex(p=>!progress[p.eq]);
start(firstOpen>=0?firstOpen:0);applyLang();
})();
</script>

<script>
(function(){
  const L=()=>document.documentElement.lang==='ru';
  const btn=document.getElementById('install-btn'),tip=document.getElementById('ios-tip');
  const label=()=>{btn.textContent=L()?'⬇ Установить':'⬇ Install';tip.textContent=L()?'На iPhone/iPad: нажми «Поделиться» ⬆, затем «На экран Домой».':'On iPhone/iPad: tap Share ⬆, then “Add to Home Screen”.'};
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  let deferred=null;
  label();new MutationObserver(label).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  if(!standalone){
    addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;btn.hidden=false});
    if(ios)btn.hidden=false;
  }
  btn.addEventListener('click',async()=>{
    if(deferred){deferred.prompt();await deferred.userChoice.catch(()=>{});deferred=null;btn.hidden=true}
    else if(ios){tip.hidden=!tip.hidden}
  });
  addEventListener('appinstalled',()=>{btn.hidden=true});
  if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
